# Main Configuration for F1 Lap Time Forecasting Pipeline

data:
  # Ergast F1 API Configuration
  api:
    base_url: "http://ergast.com/api/f1"
    rate_limit: 4  # requests per second
    timeout: 30  # seconds
    cache_enabled: true
    retry_attempts: 3
    retry_delay: 2  # seconds

  # Seasons to fetch
  seasons:
    start: 2000
    end: 2024

  # Data storage paths
  paths:
    raw: "data/raw"
    processed: "data/processed"
    features: "data/features"
    splits: "data/splits"

# Feature Engineering Configuration
features:
  # Feature toggles
  enabled_features:
    driver_features: true
    track_features: true
    weather_features: true
    historical_features: true
    tire_features: true
    temporal_features: true

  # Time-series feature parameters
  temporal:
    rolling_windows: [3, 5, 10]
    lag_features: [1, 2, 3]

  # Historical lookback
  historical:
    races_lookback: 5
    seasons_lookback: 2

# Training Configuration
training:
  # Data splits (chronological)
  splits:
    train_end_year: 2019
    validation_start_year: 2020
    validation_end_year: 2021
    test_start_year: 2022

  # Cross-validation
  cv:
    strategy: "time_series_split"
    n_folds: 5
    shuffle: false

  # Random seed for reproducibility
  random_state: 42

  # Metrics
  metrics:
    primary: "mae"
    secondary: ["rmse", "r2", "mape"]

# Model Configuration
models:
  xgboost:
    enabled: true
    params:
      learning_rate: 0.1
      max_depth: 6
      n_estimators: 100
      subsample: 0.8
      colsample_bytree: 0.8
      objective: "reg:squarederror"
      random_state: 42
    tuning:
      enabled: true
      param_grid:
        learning_rate: [0.01, 0.05, 0.1]
        max_depth: [3, 6, 9]
        n_estimators: [100, 200, 300]

  random_forest:
    enabled: true
    params:
      n_estimators: 100
      max_depth: 20
      min_samples_split: 5
      min_samples_leaf: 2
      random_state: 42
    tuning:
      enabled: true
      param_grid:
        n_estimators: [50, 100, 200]
        max_depth: [10, 20, 30]
        min_samples_split: [2, 5, 10]

  svr:
    enabled: true
    params:
      kernel: "rbf"
      C: 1.0
      epsilon: 0.1
      gamma: "scale"
    tuning:
      enabled: true
      param_grid:
        C: [0.1, 1.0, 10.0]
        epsilon: [0.01, 0.1, 0.2]
        kernel: ["rbf", "linear"]

  knn:
    enabled: true
    params:
      n_neighbors: 5
      weights: "distance"
      metric: "euclidean"
    tuning:
      enabled: true
      param_grid:
        n_neighbors: [3, 5, 7, 10]
        weights: ["uniform", "distance"]

  ridge:
    enabled: true
    params:
      alpha: 1.0
      random_state: 42
    tuning:
      enabled: true
      param_grid:
        alpha: [0.1, 1.0, 10.0, 100.0]

  arima:
    enabled: true
    params:
      seasonal: true
      m: 10  # seasonality period (laps)
      max_p: 5
      max_q: 5
      max_d: 2

  neural_net:
    enabled: true
    params:
      hidden_layers: [128, 64, 32]
      dropout_rate: 0.3
      learning_rate: 0.001
      batch_size: 32
      epochs: 100
      early_stopping_patience: 10
      validation_split: 0.2
    tuning:
      enabled: true
      param_grid:
        hidden_layers: [[64, 32], [128, 64, 32], [256, 128, 64]]
        dropout_rate: [0.2, 0.3, 0.4]
        learning_rate: [0.001, 0.0005]

  stacking:
    enabled: true
    base_models: ["xgboost", "random_forest", "svr", "ridge"]
    meta_learner: "ridge"
    cv_folds: 5

# Feature Selection
feature_selection:
  enabled: true
  method: "rfecv"
  min_features_to_select: 10
  cv_folds: 5
  step: 1

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/pipeline.log"

# Paths
paths:
  models: "models"
  results: "results"
  logs: "logs"
